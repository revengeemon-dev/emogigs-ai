<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#09090f">
  <meta name="description"
        content="Emogigs AI — Your personal AI Life OS">

  <title>Emogigs AI</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #08080d;
      color: #f5f5f7;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(111, 70, 255, .16),
          transparent 35%
        ),
        #08080d;
    }

    .screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding-bottom: 88px;
    }

    .screen.active {
      display: block;
    }

    .container {
      width: min(100%, 900px);
      margin: auto;
      padding: 18px;
    }

    /* ================= HEADER ================= */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(8, 8, 13, .86);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon,
    .message-ai-avatar {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background:
        linear-gradient(
          135deg,
          #7c4dff,
          #38bdf8
        );
      color: white;
      font-weight: 800;
      box-shadow:
        0 0 24px rgba(124,77,255,.28);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #9696a5;
      margin-top: 2px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: #fff;
      border-radius: 13px;
    }

    /* ================= HERO ================= */

    .hero {
      padding: 34px 0 20px;
    }

    .eyebrow {
      color: #a78bfa;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 54px);
      line-height: 1.04;
      letter-spacing: -1.8px;
    }

    .gradient-text {
      background:
        linear-gradient(
          90deg,
          #fff,
          #a78bfa,
          #38bdf8
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      color: #a0a0af;
      line-height: 1.65;
      max-width: 650px;
      margin: 15px 0 25px;
    }

    /* ================= HOME INPUT ================= */

    .ask-card {
      padding: 12px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.045);
      box-shadow:
        0 20px 70px rgba(0,0,0,.25);
    }

    .ask-card textarea {
      width: 100%;
      min-height: 70px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      padding: 10px;
      line-height: 1.55;
    }

    .ask-card textarea::placeholder {
      color: #707080;
    }

    .ask-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 6px;
    }

    .send-button {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 16px;
      background:
        linear-gradient(
          135deg,
          #7c4dff,
          #38bdf8
        );
      color: #fff;
      font-size: 21px;
      box-shadow:
        0 10px 28px rgba(99,102,241,.28);
    }

    .send-button:disabled {
      opacity: .45;
    }

    /* ================= QUICK TOOLS ================= */

    .section {
      margin-top: 30px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .tool-card {
      text-align: left;
      padding: 17px;
      min-height: 125px;
      color: white;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.035);
      transition: transform .18s ease;
    }

    .tool-card:active {
      transform: scale(.97);
    }

    .tool-icon {
      font-size: 25px;
      margin-bottom: 15px;
    }

    .tool-title {
      font-weight: 750;
      margin-bottom: 5px;
    }

    .tool-desc {
      color: #8d8d9b;
      font-size: 12px;
      line-height: 1.4;
    }

    /* ================= RECENT ================= */

    .recent-list {
      display: grid;
      gap: 8px;
    }

    .recent-item {
      width: 100%;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 10px;
      text-align: left;
      padding: 12px;
      color: white;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      background: rgba(255,255,255,.03);
    }

    .recent-icon,
    .history-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: rgba(124,77,255,.14);
      color: #b9a7ff;
    }

    .recent-title {
      font-size: 14px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-time {
      color: #777785;
      font-size: 11px;
    }

    /* ================= CHAT ================= */

    .chat-screen {
      padding-bottom: 100px;
    }

    .chat-topbar {
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .chat-title {
      flex: 1;
      text-align: center;
    }

    .chat-title strong {
      display: block;
      font-size: 15px;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #7dd3fc;
      font-size: 10px;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }

    .chat-messages {
      width: min(100%, 900px);
      margin: auto;
      padding: 18px;
      min-height: calc(100vh - 160px);
    }

    .chat-message {
      display: flex;
      margin: 13px 0;
      gap: 9px;
    }

    .chat-message.user {
      justify-content: flex-end;
    }

    .chat-message.ai {
      align-items: flex-start;
    }

    .user-bubble,
    .ai-bubble {
      max-width: min(82%, 680px);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
      font-size: 14px;
    }

    .user-bubble {
      padding: 12px 15px;
      border-radius: 20px 20px 5px 20px;
      background:
        linear-gradient(
          135deg,
          #6941d9,
          #4361ee
        );
    }

    .ai-message-wrap {
      max-width: calc(100% - 48px);
    }

    .ai-bubble {
      padding: 12px 15px;
      border-radius: 5px 20px 20px 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.06);
    }

    .message-ai-avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      font-size: 15px;
    }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .message-action {
      border: 0;
      background: transparent;
      color: #777786;
      width: 34px;
      height: 30px;
      border-radius: 9px;
    }

    .message-action:active,
    .message-action:hover {
      background: rgba(255,255,255,.06);
      color: #fff;
    }

    .voice-action-button.speaking {
      color: #a78bfa;
      background: rgba(124,77,255,.14);
    }

    /* ================= THINKING ================= */

    .thinking {
      display: flex;
      gap: 5px;
      padding: 3px;
    }

    .thinking span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      animation: thinking 1s infinite ease-in-out;
    }

    .thinking span:nth-child(2) {
      animation-delay: .15s;
    }

    .thinking span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes thinking {
      0%, 100% {
        opacity: .25;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* ================= CHAT INPUT ================= */

    .chat-input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding:
        10px
        max(12px, env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      background: rgba(8,8,13,.91);
      backdrop-filter: blur(18px);
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .chat-input-inner {
      width: min(100%, 900px);
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
    }

    .chat-input-inner textarea {
      flex: 1;
      min-height: 40px;
      max-height: 130px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      padding: 10px;
      line-height: 1.45;
    }

    .chat-input-inner textarea::placeholder {
      color: #707080;
    }

    .mic-button,
    .chat-send {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      color: #fff;
    }

    .chat-send {
      background:
        linear-gradient(
          135deg,
          #7c4dff,
          #38bdf8
        );
    }

    .voice-mic-button.listening {
      background: rgba(239,68,68,.18);
      color: #fb7185;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      50% {
        box-shadow:
          0 0 0 7px rgba(239,68,68,.08);
      }
    }

    /* ================= HISTORY ================= */

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 42px 1fr 40px;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.035);
    }

    .history-info {
      min-width: 0;
    }

    .history-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-preview {
      color: #777786;
      font-size: 11px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-delete {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: rgba(239,68,68,.08);
      color: #fb7185;
    }

    /* ================= VOICE SETTINGS ================= */

    .voice-panel {
      display: none;
      margin-top: 12px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);
    }

    .voice-panel.show {
      display: block;
    }

    .voice-row {
      margin-bottom: 15px;
    }

    .voice-row:last-child {
      margin-bottom: 0;
    }

    .voice-row label {
      display: block;
      font-size: 12px;
      color: #9b9baa;
      margin-bottom: 7px;
    }

    .voice-row select,
    .voice-row input {
      width: 100%;
    }

    .voice-row select {
      color: white;
      background: #15151e;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 10px;
      outline: 0;
    }

    .voice-status {
      color: #777786;
      font-size: 11px;
      margin-top: 8px;
    }

    .voice-status.active {
      color: #7dd3fc;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding:
        8px
        max(8px, env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      background: rgba(8,8,13,.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: #686875;
      padding: 8px 4px;
      border-radius: 14px;
      font-size: 11px;
    }

    .nav-btn span {
      display: block;
      font-size: 20px;
      margin-bottom: 2px;
    }

    .nav-btn.active {
      color: #b9a7ff;
      background: rgba(124,77,255,.09);
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      z-index: 100;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 15px;
      border-radius: 13px;
      background: #1d1d27;
      border: 1px solid rgba(255,255,255,.08);
      color: white;
      font-size: 12px;
      transition: .25s ease;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ================= EMPTY ================= */

    .empty-state {
      text-align: center;
      color: #777786;
      padding: 35px 15px;
    }

    .empty-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    @media (min-width: 700px) {
      .tools-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .bottom-nav {
        width: min(600px, 100%);
        left: 50%;
        transform: translateX(-50%);
        border: 1px solid rgba(255,255,255,.07);
        border-bottom: 0;
        border-radius: 20px 20px 0 0;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ================= HOME ================= -->

  <section id="homeScreen" class="screen active">

    <header class="topbar">

      <div class="brand">
        <div class="brand-icon">✦</div>

        <div>
          <div class="brand-title">
            Emogigs AI
          </div>

          <div class="brand-subtitle">
            Your personal AI Life OS
          </div>
        </div>
      </div>

      <button
        id="headerNewChat"
        class="icon-button"
        type="button"
        aria-label="New chat">
        ＋
      </button>

    </header>


    <main class="container">

      <div class="hero">

        <div class="eyebrow">
          ✦ AI Life OS
        </div>

        <h1>
          What can I help you
          <span class="gradient-text">
            achieve?
          </span>
        </h1>

        <p>
          Learn new skills, solve problems,
          plan your goals, create content,
          find opportunities and grow with
          Emogigs AI.
        </p>

      </div>


      <div class="ask-card">

        <textarea
          id="homeInput"
          rows="2"
          placeholder="Ask Emogigs AI anything..."></textarea>

        <div class="ask-footer">

          <button
            id="homeSend"
            class="send-button"
            type="button">
            ↑
          </button>

        </div>

      </div>


      <!-- QUICK TOOLS -->

      <section class="section">

        <div class="section-heading">
          <h2>Quick Tools</h2>
        </div>

        <div class="tools-grid">

          <button
            class="tool-card"
            data-template="Create a step-by-step learning roadmap for me."
            type="button">

            <div class="tool-icon">📚</div>
            <div class="tool-title">Learn</div>
            <div class="tool-desc">
              Build new skills step by step.
            </div>

          </button>


          <button
            class="tool-card"
            data-template="Help me find skills and work opportunities that fit me."
            type="button">

            <div class="tool-icon">💼</div>
            <div class="tool-title">Work</div>
            <div class="tool-desc">
              Explore skills and opportunities.
            </div>

          </button>


          <button
            class="tool-card"
            data-template="Help me organize my goals and create a practical plan."
            type="button">

            <div class="tool-icon">🎯</div>
            <div class="tool-title">Plan</div>
            <div class="tool-desc">
              Organize your goals and tasks.
            </div>

          </button>


          <button
            class="tool-card"
            data-template="Create a personal improvement plan for me."
            type="button">

            <div class="tool-icon">🚀</div>
            <div class="tool-title">Grow</div>
            <div class="tool-desc">
              Improve yourself step by step.
            </div>

          </button>

        </div>

      </section>


      <!-- RECENT CHATS -->

      <section class="section">

        <div class="section-heading">
          <h2>Recent Chats</h2>
        </div>

        <div
          id="recentChats"
          class="recent-list">
        </div>

      </section>

    </main>

  </section>


  <!-- ================= CHAT ================= -->

  <section id="chatScreen" class="screen chat-screen">

    <header class="topbar chat-topbar">

      <button
        id="chatBack"
        class="icon-button"
        type="button">
        ←
      </button>


      <div class="chat-title">

        <strong>
          Emogigs AI
        </strong>

        <span class="online">
          <span class="online-dot"></span>
          Online
        </span>

      </div>


      <button
        id="voiceSettingsButton"
        class="icon-button"
        type="button"
        title="Voice settings">
        ⚙
      </button>

    </header>


    <div
      id="chatMessages"
      class="chat-messages">
    </div>


    <!-- VOICE SETTINGS -->

    <div
      id="voiceSettingsPanel"
      class="voice-panel container">

      <div class="voice-row">

        <label for="voiceGender">
          Voice
        </label>

        <select id="voiceGender">

          <option value="natural">
            Natural
          </option>

          <option value="female">
            Female
          </option>

          <option value="male">
            Male
          </option>

        </select>

      </div>


      <div class="voice-row">

        <label for="voiceLanguage">
          Language
        </label>

        <select id="voiceLanguage">

          <option value="auto">
            Auto
          </option>

          <option value="en-US">
            English
          </option>

          <option value="bn-BD">
            বাংলা
          </option>

        </select>

      </div>


      <div class="voice-row">

        <label for="voiceRate">
          Speaking speed:
          <span id="voiceRateValue">
            1.00×
          </span>
        </label>

        <input
          id="voiceRate"
          type="range"
          min="0.6"
          max="1.5"
          step="0.05"
          value="1">

      </div>


      <div class="voice-row">

        <label for="voiceAutoSpeak">
          Auto speak AI responses
        </label>

        <select id="voiceAutoSpeak">

          <option value="on">
            On
          </option>

          <option value="off">
            Off
          </option>

        </select>

      </div>


      <div class="voice-row">

        <label for="voiceConversation">
          Voice conversation mode
        </label>

        <select id="voiceConversation">

          <option value="off">
            Off
          </option>

          <option value="on">
            On
          </option>

        </select>

      </div>


      <div
        id="voiceStatus"
        class="voice-status">
        Voice ready
      </div>

    </div>


    <!-- CHAT INPUT -->

    <div class="chat-input-bar">

      <div class="chat-input-inner">

        <textarea
          id="chatInput"
          rows="1"
          placeholder="Message Emogigs AI..."></textarea>


        <button
          id="voiceMicButton"
          class="mic-button voice-mic-button"
          type="button"
          title="Voice input">
          🎙️
        </button>


        <button
          id="chatSend"
          class="chat-send"
          type="button"
          aria-label="Send">
          ↑
        </button>

      </div>

    </div>

  </section>


  <!-- ================= HISTORY ================= -->

  <section id="historyScreen" class="screen">

    <header class="topbar">

      <div class="brand">

        <div class="brand-icon">
          ▣
        </div>

        <div>
          <div class="brand-title">
            Chat History
          </div>

          <div class="brand-subtitle">
            Your conversations
          </div>
        </div>

      </div>

    </header>


    <main class="container">

      <div
        id="historyList"
        class="history-list">
      </div>

    </main>

  </section>


  <!-- ================= NAV ================= -->

  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      data-screen="homeScreen"
      type="button">

      <span>⌂</span>
      Home

    </button>


    <button
      class="nav-btn"
      data-screen="chatScreen"
      type="button">

      <span>✦</span>
      AI

    </button>


    <button
      class="nav-btn"
      data-screen="historyScreen"
      type="button">

      <span>▣</span>
      History

    </button>

  </nav>
